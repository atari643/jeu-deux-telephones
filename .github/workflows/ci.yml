# Arbitre commun aux deux développeurs : une PR ne se fusionne que si ce job est vert.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Format, qualité, tests, APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain spotlessCheck detekt testDebugUnitTest assembleDebug
      # Les snapshots sont enregistrés sous Windows : un écart de rendu Linux est possible.
      # Informatif ici (rapport en artifact), bloquant en local via tools/check.ps1.
      - name: Régression visuelle (informatif)
        continue-on-error: true
        run: ./gradlew --console=plain verifyRoborazziDebug
      - name: APK debug à installer sur les téléphones
        uses: actions/upload-artifact@v4
        with:
          name: jeu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
          retention-days: 7
