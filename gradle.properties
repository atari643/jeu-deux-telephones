# Memoire sobre : le LLM local (llama-server) occupe deja ~19 Go de memoire engagee.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.console=plain
# Compilateur Kotlin dans le daemon Gradle (pas de 2e JVM Kotlin daemon)
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
